services:
  - type: web
    name: arabic-doc-qa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Set these in the Render dashboard; sync:false keeps them out of git.
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MAX_PAGES
        value: "20"
