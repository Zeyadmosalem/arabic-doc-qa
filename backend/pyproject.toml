[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-doc-qa"
version = "0.1.0"
description = "Arabic + English document Q&A with page citations"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zeyad M. Salem" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "groq>=0.11",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
